# Shared unit and physical constants for the mission/OD framework.
# These values are loaded once by simulation_config.py. Mission-design and
# algorithm settings remain in the main simulation YAML.

# Exact/conventional unit definitions
AU_TO_M: 149597870700.0
KM_TO_M: 1000.0
SECONDS_PER_DAY: 86400.0
MAS_TO_DEGREE: 3600000.0

# Spherical body/environment constants used consistently by occultation and SNR.
# Earth and Moon use one mean-sphere radius each; any future occultation safety
# margin should be configured separately rather than changing these radii.
SUN_RADIUS_KM: 695700.0
SUN_TEMPERATURE_K: 5772.0
EARTH_RADIUS_KM: 6371.0
MOON_RADIUS_KM: 1737.4

# Dynamics constants. Gravitational parameters and mass ratios are derived from
# this single G + mass set at startup; do not also configure independent GMs.
# These masses preserve the values used by the current framework and are rounded;
# switching to a high-accuracy NAIF/SPICE GM set should be a separate model change.
GRAVITATIONAL_CONSTANT: 6.67430e-11
SUN_MASS: 1.989e+30
MERCURY_MASS: 0.33e+24
VENUS_MASS: 4.87e+24
EARTH_MASS: 5.97e+24
MOON_MASS: 0.073e+24
MARS_MASS: 0.642e+24
JUPITER_MASS: 1898.0e+24
SATURN_MASS: 568.0e+24
URANUS_MASS: 86.8e+24
NEPTUNE_MASS: 102.0e+24

# The mission currently treats the Earth Hill-region threshold as 0.01 AU.
EARTH_HILL_RADIUS_AU: 0.01
